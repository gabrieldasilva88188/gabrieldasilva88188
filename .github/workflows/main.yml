name: Gerar cobrinha e cards do perfil

on:
  # roda automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda quando o README ou os scripts mudam
  push:
    branches:
      - main
    paths-ignore:
      - "assets/gerado/**"

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  gerar:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      # animação da cobrinha comendo o gráfico de contribuições (versões clara e escura)
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0f9e78&color_dots=#ebedf0,#b7f0de,#6ee0bd,#2bd9a6,#0f9e78
            dist/snake-dark.svg?palette=github-dark&color_snake=#2bd9a6&color_dots=#161b22,#0b3d33,#0f6b54,#1aa883,#2bd9a6

      # cards de estatísticas e linguagens gerados direto da API do GitHub
      - name: Gerar cards de estatísticas
        run: node .github/scripts/stats.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # salva os SVGs em assets/gerado na própria branch main.
      # O README usa caminhos relativos, que o GitHub sempre carrega sem cache externo.
      - name: Salvar cards no repositório
        run: |
          mkdir -p assets/gerado
          cp dist/*.svg assets/gerado/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gerado
          if git diff --cached --quiet; then
            echo "Nada mudou nos cards."
          else
            git commit -m "chore: atualizar cards do perfil"
            git push
          fi
