name: Gerar cobrinha e cards do perfil

on:
  # roda automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda a cada push na branch principal
  push:
    branches:
      - main

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  gerar:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      # animação da cobrinha comendo o gráfico de contribuições (versões clara e escura)
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0f9e78&color_dots=#ebedf0,#b7f0de,#6ee0bd,#2bd9a6,#0f9e78
            dist/snake-dark.svg?palette=github-dark&color_snake=#2bd9a6&color_dots=#161b22,#0b3d33,#0f6b54,#1aa883,#2bd9a6

      # cards de estatísticas e linguagens gerados direto da API do GitHub
      - name: Gerar cards de estatísticas
        run: node .github/scripts/stats.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publica tudo na branch "output"
      # endereço: https://raw.githubusercontent.com/<usuario>/<usuario>/output/<arquivo>
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
